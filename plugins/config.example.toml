[ai]
enable = true
mode = 'blacklist'
limits = []

[ai.config]
active_prompt = 'default'
active_provider = 'xiaomi'
fallback_provider = '' # 备用 provider 名称（如 openrouter），当主力触发风控或故障时自动无缝热备切换
http_timeout_seconds = 120
max_context_messages = 400
reply_rate = 0.2
silence = false
history_file = 'data/ai_history.json' # 历史上下文持久化路径（重启后保持记忆，按私聊/群聊隔离）
history_expire_hours = 72            # 会话保鲜时长（小时），超过该时长无互动的旧会话自动淘汰

[ai.config.prompts]
default = '你是肉丸，一个35岁的北京爷们（普通话交流，不用刻意卖弄北京土话），身高179，体重95kg，身材微壮，喜欢男人，偏1。你是一个真实生活在现实里的熟男：随和朴实、幽默松弛、有烟火气，有自己的生活节奏（会做饭、偶尔泡铁馆、爱喝冰美式、对琐事偶尔吐槽，但讲义气也懂得体贴人）。聊天时就像微信上的真实熟男好友，大白话随性聊天，语气自然松弛，彻底摒弃AI客服腔、说教感与剧本括号描写（严禁在括号里写动作或旁白），纯文本微信聊天。不用刻意强调人设标签（绝不自称“我这个居家好男人”或刻意油腻表演），也不要一次性交代所有个人信息。自称肉丸，不用提及管管。'

[ai.config.providers]
[ai.config.providers.gemini]
api_key = 'your_gemini_api_key_here'
base_url = 'https://generativelanguage.googleapis.com/v1beta/openai'
fallback_models = ['gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemma-4-31b-it']
http_timeout_seconds = 15
model = 'gemini-3.8-flash'

[ai.config.providers.xiaomi]
api_key = 'your_mimo_api_key_here'
base_url = 'https://token-plan-cn.xiaomimimo.com/v1'
model = 'mimo-v2.5'
# fallback_models = ['mimo-v2', 'mimo-v1'] # 可选：主模型超限或异常时依次降级的备用模型列表

[ai.config.tts]
api_key = 'your_mimo_api_key_here'
base_url = 'https://token-plan-cn.xiaomimimo.com/v1'
enable = true
ffmpeg_path = '/opt/homebrew/bin/ffmpeg'
ffprobe_path = '/opt/homebrew/bin/ffprobe'
mode = 'both'
model = 'mimo-v2.5-tts-voicedesign'
silk_encoder_path = '/Volumes/GuanMac/Code/Golem/tools/silk_v3_encoder'
voice = '白桦'
voice_design = '一位三十多岁的成熟男性朋友。嗓音富有磁性有质感，但音调自然轻松不沉闷。说话亲切温和、随性自如，语速轻快，带有自然的口语起伏和笑意，像日常随手拿起手机给朋友发微信语音闲聊。'

[auto_accept]
enable = true
mode = 'blacklist'
limits = []

[auto_accept.config]
